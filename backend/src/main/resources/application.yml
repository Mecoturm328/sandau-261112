server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/csv,text/html,text/css,application/javascript

spring:
  application:
    name: mori-coffee-dashboard
  datasource:
    url: jdbc:sqlite:${DB_PATH:./data/mori-coffee.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 15000
      connection-init-sql: PRAGMA foreign_keys = ON
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  seed:
    enabled: ${SEED_ENABLED:true}
  cors:
    allowed-origin-patterns: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
